name: SiT
channels:
  - pytorch
  - nvidia
dependencies:
  - python >= 3.8
  - pytorch >= 1.13
  - torchvision
  - pytorch-cuda >=11.7
  - pip
  - pip:
    - timm
    - diffusers
    - accelerate
    - torchdiffeq
    - wandb
    # text-rendering scaling experiment
    - pyarrow
    - huggingface_hub
    - transformers>=4.51
    - python-doctr
    - torchmetrics
    - torch-fidelity
    - scipy
    - rapidfuzz
